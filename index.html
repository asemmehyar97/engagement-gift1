<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift</title>
    <style>
        /* RESET & BASICS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #f5f5f5; 
            font-family: 'Georgia', serif; 
            color: white;
            overflow-x: hidden;
        }

        /* SCROLLYTELLING CONTAINER */
        .story-container {
            width: 100%;
        }

        /* THE PHOTO CARDS */
        .card {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.3); /* Shadow gives depth */
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures photo covers screen perfectly */
        }

        /* CAPTION TEXT OVERLAY (Optional) */
        .caption {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            text-shadow: 1px 1px 10px rgba(0,0,0,0.8);
            width: 90%;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }
        
        .caption h2 { font-size: 2rem; margin-bottom: 10px; font-weight: 300; }
        .caption p { font-size: 1rem; font-weight: 300; letter-spacing: 1px; }

        @keyframes fadeIn { to { opacity: 1; } }

        /* FINAL MESSAGE SECTION */
        .final-message {
            position: relative; 
            height: 100vh; 
            background-color: #1a1a1a; 
            color: #d4af37; /* Gold color */
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            text-align: center;
            padding: 20px;
            z-index: 100; /* Ensures it sits on top at the end */
        }

        .final-message h1 { font-size: 3rem; margin-bottom: 20px; }
        .final-message p { font-size: 1.2rem; line-height: 1.6; max-width: 600px; color: #fff; }
        .signature { margin-top: 40px; font-style: italic; color: #d4af37; }

    </style>
</head>
<body>

    <div class="story-container">
        
        <div class="card">
            <img src="images/1.jpg" alt="Couple Photo 1">
            <div class="caption">
                <h2>The Beginning</h2>
            </div>
        </div>

        <div class="card">
            <img src="images/2.jpg" alt="Couple Photo 2">
        </div>

        <div class="card">
            <img src="images/3.jpg" alt="Couple Photo 3">
        </div>

        <div class="card">
            <img src="images/4.jpg" alt="Couple Photo 4">
        </div>

        <div class="card">
            <img src="images/5.jpg" alt="Couple Photo 5">
        </div>

        <div class="final-message">
            <h1>Congratulations</h1>
            <p>
                Watching your journey has been beautiful. <br>
                May you build a life together as perfectly fitting as the puzzle pieces.<br>
                We wish you endless joy and love.
            </p>
            <div class="signature">
                With love,<br>
                <strong>Asem & Nedal</strong>
            </div>
        </div>

    </div>

</body>
</html>
